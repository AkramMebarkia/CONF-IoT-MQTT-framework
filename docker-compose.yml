version: '3.8'

services:
  # NanoMQ Broker
  nanomq:
    image: emqx/nanomq:latest
    container_name: nanomq
    ports:
      - "1883:1883"      # MQTT port
      - "8083:8083"      # WebSocket port
      - "8883:8883"      # MQTT SSL port (optional)
    networks:
      - mqtt_network
    volumes:
      - /etc/localtime:/etc/localtime:ro  # Sync time with host
      - /etc/timezone:/etc/timezone:ro    # Sync timezone with host
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nanomq", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node-RED
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"      # Node-RED UI
    volumes:
      - ./node-red-data:/data    # Persist flows and settings
      - /etc/localtime:/etc/localtime:ro  # Sync time with host
      - /etc/timezone:/etc/timezone:ro    # Sync timezone with host
    environment:
      - TZ=UTC
    networks:
      - mqtt_network
    depends_on:
      - nanomq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 3

